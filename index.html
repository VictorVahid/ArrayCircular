<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrossel Circular Horizontal</title>
  <!-- Vincula o arquivo CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Carrossel Circular</h1>
  <p>Estrutura modular com array circular</p>

  <!-- Container horizontal -->
  <div class="carousel-container">
    <div class="card">Slide A</div>
    <div class="card">Slide B</div>
    <div class="card">Slide C</div>
    <div class="card">Slide D</div>
    <div class="card">Slide E</div>
  </div>

  <!-- Botões de controle -->
  <div class="controls">
    <button id="prev">◀ Voltar</button>
    <button id="next">Avançar ▶</button>
  </div>

  <!-- Vincula o arquivo JavaScript externo (no final do body) -->
  <script src="script.js"></script>
</body>

</html>
